name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY secret is not set"; exit 1
          fi
          mkdir -p _site
          # index.html is the Pages entry point, built from the source map page
          cp sklypas-google.html _site/index.html
          python3 - "$MAPS_API_KEY" <<'PY'
          import sys, pathlib
          key = sys.argv[1]
          p = pathlib.Path("_site/index.html")
          html = p.read_text(encoding="utf-8")
          # the key goes in via the placeholder, so config.js (local dev only,
          # git-ignored and therefore never deployed) would just 404 in the browser
          html = html.replace('  <script src="config.js"></script>\n', "")
          html = html.replace("__MAPS_API_KEY__", key)
          p.write_text(html, encoding="utf-8")
          print("Built _site/index.html: key injected, config.js tag dropped")
          PY

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # publish only the built page, not the whole repo (research notes,
          # planning docs and CONTEXT.md are not meant to be served)
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
